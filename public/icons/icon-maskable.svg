<!-- Maskable variant: the mark is scaled into the 40% safe zone so platform
     masks (circle, squircle, rounded square) never clip it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SecureQuiz">
  <rect width="512" height="512" fill="#135fc3"/>
  <g transform="translate(256 256) scale(0.8) translate(-256 -256)">
    <g fill="none" stroke="#ffffff" stroke-width="34">
      <circle cx="160" cy="160" r="58"/>
      <circle cx="160" cy="352" r="58"/>
      <circle cx="352" cy="352" r="58"/>
    </g>
    <circle cx="352" cy="160" r="75" fill="#ffffff"/>
  </g>
</svg>
